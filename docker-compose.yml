version: "3.9"

services:
  # PostgreSQL database container
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cinevault
      POSTGRES_PASSWORD: cinevault_password
      POSTGRES_DB: cinevault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # FastAPI backend container
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cinevault:cinevault_password@db:5432/cinevault_db
      SECRET_KEY: cinevault-super-secret-key
    depends_on:
      - db
    volumes:
      - ./backend/app:/app/app

  # Next.js frontend container
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data: